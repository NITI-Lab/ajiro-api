openapi: 3.0.3
info:
  title: Petstore
  version: 1.0.0
paths:
  /pets:
    get:
      operationId: listPets
      summary: List pets
      tags: [pets]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: tag
          in: query
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
    post:
      operationId: createPet
      summary: Create a pet
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "422":
          description: invalid
          content:
            application/json:
              example: { error: "name is required" }
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getPetById
      summary: Get a pet
      tags: [pets]
      parameters:
        - name: X-Request-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          description: not found
          content:
            application/json:
              example: { error: "pet not found" }
    delete:
      summary: Delete a pet
      responses:
        "204":
          description: deleted
components:
  schemas:
    NewPet:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Rex }
        status: { type: string, enum: [available, sold] }
    Pet:
      allOf:
        - $ref: "#/components/schemas/NewPet"
        - type: object
          properties:
            id: { type: integer, example: 1 }
            email: { type: string, format: email }
            born: { type: string, format: date-time }
            vaccinated: { type: boolean }
            tags:
              type: array
              items: { type: string }
