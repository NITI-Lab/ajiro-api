[package]
name = "ajiro-api"
version = "0.1.6"
edition = "2021"
description = "API definitions, regression tests and mocks generated by AI coding agents from your backend code"
license = "MIT"
repository = "https://github.com/niti-lab/ajiro-api"
readme = "README.md"
keywords = ["api", "testing", "openapi", "claude-code", "cli"]
categories = ["command-line-utilities", "development-tools::testing"]
rust-version = "1.80"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
indexmap = { version = "2.14.2", features = ["serde"] }
jsonschema = { version = "0.61.2", default-features = false }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_json_path = "0.7.2"
serde-yaml-rust2 = "0.5.0"
thiserror = "2.0.21"
tiny_http = "0.12.0"
tree-sitter = "0.27.2"
tree-sitter-go = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-typescript = "0.23.2"
ureq = { version = "3.5.2", features = ["json"] }
uuid = { version = "1.29.2", features = ["v4"] }
walkdir = "2.5.0"
ignore = { version = "0.4.30", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"

[lib]
name = "ajiro_api"
path = "src/lib.rs"

[[bin]]
name = "ajiro-api"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
