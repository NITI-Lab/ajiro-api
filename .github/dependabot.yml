version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: develop
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
  - package-ecosystem: npm
    directory: /npm/ajiro-api
    schedule:
      interval: monthly
    target-branch: develop
