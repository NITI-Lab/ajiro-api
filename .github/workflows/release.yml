name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, use_cross: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, use_cross: true }
          - { target: x86_64-apple-darwin, os: macos-13, use_cross: false }
          - { target: aarch64-apple-darwin, os: macos-latest, use_cross: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, use_cross: false }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (cross, static musl)
        if: matrix.use_cross
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="ajiro-api-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/ajiro-api.exe" "dist/$NAME/"
          else
            cp "target/${{ matrix.target }}/release/ajiro-api" "dist/$NAME/"
          fi
          cp LICENSE README.md README.en.md "dist/$NAME/"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "$NAME.zip" "$NAME" > /dev/null
            ARCHIVE="$NAME.zip"
          else
            tar czf "$NAME.tar.gz" "$NAME"
            ARCHIVE="$NAME.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Combined checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          ls -l
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  npm:
    needs: release
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Check for NPM_TOKEN
        run: |
          if [ -z "$NPM_TOKEN" ]; then echo "NPM_TOKEN is not set; skipping npm publish."; fi
      - uses: actions/checkout@v4
        if: env.NPM_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.NPM_TOKEN != ''
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        if: env.NPM_TOKEN != ''
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Build npm packages
        if: env.NPM_TOKEN != ''
        run: node npm/scripts/build-packages.mjs --version "${GITHUB_REF_NAME#v}" --dist dist --out npm/out
      - name: Publish npm packages
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          TAG=latest
          case "$GITHUB_REF_NAME" in *-*) TAG=next ;; esac
          # platform packages first, so the main package can resolve them
          for d in npm/out/cli-*; do
            (cd "$d" && npm publish --access public --tag "$TAG")
          done
          (cd npm/out/ajiro-api && npm publish --access public --tag "$TAG")

  crates:
    needs: release
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Check for CARGO_REGISTRY_TOKEN
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then echo "CARGO_REGISTRY_TOKEN is not set; skipping crates.io publish."; fi
      - uses: actions/checkout@v4
        if: env.CARGO_REGISTRY_TOKEN != ''
      - uses: dtolnay/rust-toolchain@stable
        if: env.CARGO_REGISTRY_TOKEN != ''
      - name: Publish crate
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --locked

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check for HOMEBREW_TAP_TOKEN
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "HOMEBREW_TAP_TOKEN is not set; skipping Homebrew tap update."; fi
      - uses: actions/checkout@v4
        if: env.TAP_TOKEN != ''
      - uses: actions/download-artifact@v4
        if: env.TAP_TOKEN != ''
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Render formula and push to tap
        if: env.TAP_TOKEN != ''
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          sha() { cut -d' ' -f1 "dist/ajiro-api-${VERSION}-$1.tar.gz.sha256"; }
          sed \
            -e "s/__VERSION__/${VERSION}/g" \
            -e "s/__SHA256_AARCH64_DARWIN__/$(sha aarch64-apple-darwin)/" \
            -e "s/__SHA256_X86_64_DARWIN__/$(sha x86_64-apple-darwin)/" \
            -e "s/__SHA256_AARCH64_LINUX__/$(sha aarch64-unknown-linux-musl)/" \
            -e "s/__SHA256_X86_64_LINUX__/$(sha x86_64-unknown-linux-musl)/" \
            packaging/homebrew/ajiro-api.rb > ajiro-api.rb
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/niti-lab/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp ajiro-api.rb tap/Formula/ajiro-api.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ajiro-api.rb
          git commit -m "ajiro-api ${VERSION}" || { echo "No change"; exit 0; }
          git push
