name: Bug report / バグ報告
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version (`ajiro-api --version`)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and install method
      placeholder: macOS 15 / npx, Ubuntu 24.04 / cargo, ...
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [scan, test, mock, mcp, openapi / import, docs, init / config, skill / plugin, other]
    validations:
      required: true
  - type: input
    id: framework
    attributes:
      label: Framework (for scan problems)
      placeholder: hono, nextjs, fastapi, express, go-chi, ...
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal route file / endpoint YAML and the command with `--json` output help a lot. Remove secrets.
    validations:
      required: true
